<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PT Digital • Treinamento e Certificação CMPC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Google Identity Services (Login Google 100% gratuito) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- jsPDF para emissão do Certificado em PDF direto no navegador -->

  <main class="container">
    <nav class="stepper" id="stepper" aria-label="Progresso"></nav>

  <div class="modal-backdrop hidden" id="admin-modal">
